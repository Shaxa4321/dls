<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS Turnir Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .lang-badge {
            border: 1px solid var(--text-secondary);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .section-title {
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 600;
        }
        .gradient-card {
            position: relative;
            border-radius: 16px;
            padding: 2px;
            margin-bottom: 16px;
            cursor: pointer;
            background: linear-gradient(135deg, #3b82f6, #ec4899, #8b5cf6, #10b981);
            transition: transform 0.2s ease;
        }
        .gradient-card:active {
            transform: scale(0.98);
        }
        .card-content {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
            border-radius: 14px;
            padding: 24px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card-title {
            font-size: 20px;
            font-weight: bold;
            margin-top: 8px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-area">⚽ DLS LIGA</div>
            <div class="lang-badge">UZ</div>
        </div>

        <div id="main-menu">
            <div class="section-title">BO'LIMNI TANLANG</div>
            
            <div class="gradient-card" onclick="showOfficialTournaments()">
                <div class="card-content">
                    <div style="font-size: 28px;">🏆</div>
                    <div class="card-title">Rasmiy turnirlar</div>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Ligalar · Jahon chempionati · ChL · YeL · Divizion</div>
                </div>
            </div>

            <div class="gradient-card" onclick="openPrivate()">
                <div class="card-content">
                    <div style="font-size: 28px;">⚔️</div>
                    <div class="card-title">Shaxsiy turnirlar</div>
                    <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Do'stlaringiz bilan o'z yopiq turniringiz</div>
                </div>
            </div>
        </div>

        <div id="official-menu" class="hidden">
            <button class="back-btn" onclick="showMainMenu()">← Bo'limlar</button>
            <div class="section-title">REJIMNI TANLANG</div>

            <div class="gradient-card" onclick="selectMode('Ligalar')">
                <div class="card-content"><div class="card-title">Ligalar</div></div>
            </div>
            <div class="gradient-card" onclick="selectMode('Jahon Chempionati')">
                <div class="card-content"><div class="card-title">Jahon Chempionati</div></div>
            </div>
            <div class="gradient-card" onclick="selectMode('UEFA Champions League')">
                <div class="card-content"><div class="card-title">UEFA Champions League</div></div>
            </div>
            <div class="gradient-card" onclick="selectMode('Europa League')">
                <div class="card-content"><div class="card-title">Europa League</div></div>
            </div>
            <div class="gradient-card" onclick="selectMode('AFC Champions League')">
                <div class="card-content"><div class="card-title">AFC Champions League</div></div>
            </div>
            <div class="gradient-card" onclick="selectMode('Divizion')">
                <div class="card-content"><div class="card-title">Divizion</div></div>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function showOfficialTournaments() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('official-menu').classList.remove('hidden');
        }

        function showMainMenu() {
            document.getElementById('official-menu').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function selectMode(modeName) {
            alert(`Siz "${modeName}" rejimini tanladingiz. Tez orada ro'yxatdan o'tish ochiladi!`);
        }

        function openPrivate() {
            alert("Shaxsiy turnirlar bo'limi ochilmoqda...");
        }
    </script>
</body>
</html>
